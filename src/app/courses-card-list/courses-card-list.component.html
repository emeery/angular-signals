@for(course of courses(); track course.id) {
    <div class="course-card" #courseCard>
        <div class="course-header">
        <span class="course-title">{{ course.title }}</span>
        </div>
        <img class="course-image" [src]="course.iconUrl" alt="{{ course.title }}">
        <div class="course-description">
            <p>{{ course.longDescription }}</p>
        </div>
        <div class="courses-actions">
            <button class="btn" [routerLink]="['courses',course.id ]">View Course</button>
            <button class="btn" (click)="onEditCourse(course)">Edit</button>
            &nbsp;
            <button matFab (click)="onCourseDeleted(course)">
        <mat-icon>delete</mat-icon>
      </button>
        </div>
    </div>
}
